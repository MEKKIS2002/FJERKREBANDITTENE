<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 T-Side Strategy Guide</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f1117;
  --bg2: #181b24;
  --bg3: #1f2330;
  --border: #2a2f3e;
  --text: #e2e8f0;
  --text2: #8b93a8;
  --blue: #3b82f6;
  --blue-bg: #1e3a5f;
  --green: #22c55e;
  --green-bg: #14341e;
  --orange: #f97316;
  --orange-bg: #3b1c0a;
  --red: #ef4444;
  --red-bg: #3b0f0f;
  --purple: #a78bfa;
  --purple-bg: #2d1b5e;
  --pink: #f472b6;
  --pink-bg: #3b0f2a;
  --accent: #f59e0b;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 24px 16px 60px;
  max-width: 1400px;
  margin: 0 auto;
}

h1 {
  font-size: 22px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 4px;
  letter-spacing: -0.3px;
}
.subtitle {
  font-size: 13px;
  color: var(--text2);
  margin-bottom: 16px;
}

/* PLAYER LEGEND */
.player-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 28px;
  padding: 12px 16px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.legend-title {
  width: 100%;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--text2);
  margin-bottom: 4px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text2);
}
.player-tag {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  white-space: nowrap;
  letter-spacing: 0.02em;
}
.tag-s15t3m  { background: #1a2e4a; color: #60a5fa; border: 1px solid #2563eb44; }
.tag-ole     { background: #14341e; color: #4ade80; border: 1px solid #16a34a44; }
.tag-propit3 { background: #3b1c0a; color: #fb923c; border: 1px solid #ea580c44; }
.tag-birk    { background: #3b0f0f; color: #f87171; border: 1px solid #dc262644; }
.tag-mekkis  { background: #2d1b5e; color: #c4b5fd; border: 1px solid #7c3aed44; }


/* MAP NAV */
.map-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 40px;
  position: sticky;
  top: 0;
  background: var(--bg);
  padding: 10px 0;
  z-index: 100;
  border-bottom: 1px solid var(--border);
}
.map-nav a {
  text-decoration: none;
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  background: var(--bg3);
  color: var(--text2);
  border: 1px solid var(--border);
  transition: all 0.15s;
}
.map-nav a:hover {
  background: var(--blue-bg);
  color: var(--blue);
  border-color: var(--blue);
}

/* MAP SECTION */
.map-section {
  margin-bottom: 56px;
  scroll-margin-top: 80px;
}
.map-header {
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--accent);
}
.map-header h2 {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
}
.map-meta {
  font-size: 13px;
  color: var(--text2);
  margin-top: 4px;
}

/* STRAT GRID */
.strat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 16px;
}

/* STRAT CARD */
.strat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  transition: border-color 0.15s;
}
.strat-card:hover { border-color: #3a4060; }

.card-top {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.card-top-info { flex: 1; min-width: 0; }

.strat-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
  margin-bottom: 3px;
}
.strat-inspired {
  font-size: 11px;
  color: var(--text2);
}

/* TYPE BADGES */
.badge {
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  white-space: nowrap;
  flex-shrink: 0;
}
.badge-execute { background: var(--blue-bg); color: var(--blue); }
.badge-split   { background: var(--green-bg); color: var(--green); }
.badge-default { background: var(--purple-bg); color: var(--purple); }
.badge-rush    { background: var(--red-bg); color: var(--red); }
.badge-pistol  { background: var(--orange-bg); color: var(--orange); }
.badge-fake    { background: var(--pink-bg); color: var(--pink); }

.desc {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.6;
}

/* SECTION LABEL */
.label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--text2);
  margin-bottom: 6px;
}

/* STEPS */
.steps {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.steps li {
  display: flex;
  gap: 8px;
  font-size: 12.5px;
  color: var(--text);
  line-height: 1.5;
  align-items: flex-start;
}
.step-num {
  min-width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--bg3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 600;
  color: var(--text2);
  flex-shrink: 0;
  margin-top: 1px;
}
.step-content {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.step-players {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

/* UTILITY */
.util-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.util-item {
  background: var(--bg3);
  border-radius: 6px;
  padding: 5px 9px;
}
.util-name {
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
}
.util-detail {
  font-size: 10px;
  color: var(--text2);
  margin-top: 1px;
}

/* DIVIDER between sections */
.card-divider {
  border: none;
  border-top: 1px solid var(--border);
}
</style>
</head>
<body>

<h1>Fjærkrebandittene Stratbook</h1>

  const nav = document.getElementById('mapNav');
  nav.innerHTML = mapOrder.map(m => `<a href="#map-${m}">${maps[m].name}</a>`).join('');

  const content = document.getElementById('content');
  content.innerHTML = mapOrder.map(mapId => {
    const map = maps[mapId];
    const cards = map.strats.map(s => `
      <div class="strat-card">
        <div class="card-top">
          <div class="card-top-info">
            <div class="strat-name">${s.name}</div>
            <div class="strat-inspired">Pro ref: ${s.inspired}</div>
          </div>
          <span class="badge ${s.badge}">${typeLabel[s.type]}</span>
        </div>
        <p class="desc">${s.desc}</p>
        <hr class="card-divider">
        <div>
          <div class="label">Execution steps</div>
          <ul class="steps">
            ${s.steps.map((step, i) => `
              <li>
                <span class="step-num">${i+1}</span>
                <div class="step-content">
                  <div class="step-players">${p(step.players)}</div>
                  <span>${step.text}</span>
                </div>
              </li>
            `).join('')}
          </ul>
        </div>
        <div>
          <div class="label">Utility required</div>
          <div class="util-row">
            ${s.utility.map(u => `<div class="util-item"><div class="util-name">${u.name}</div><div class="util-detail">${u.detail}</div></div>`).join('')}
          </div>
        </div>
      </div>
    `).join('');

    return `
      <section class="map-section" id="map-${mapId}">
        <div class="map-header">
          <h2>${map.name}</h2>
          <div class="map-meta">${map.meta}</div>
        </div>
        <div class="strat-grid">${cards}</div>
      </section>
    `;
  }).join('');
}

renderAll();
</script>
</body>
</html>
