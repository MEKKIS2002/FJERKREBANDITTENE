<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FJÆRKREBANDITTENE — STRATBOOK</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0c0c0e;
  --bg2:     #131316;
  --bg3:     #1a1a1f;
  --bg4:     #202028;
  --border:  #2a2a35;
  --border2: #3a3a48;
  --text:    #d8d8e0;
  --text2:   #787890;
  --text3:   #4a4a60;
  --gold:    #c8a84b;
  --gold2:   #e6c96a;
  --gold-bg: #1e1708;
  --orange:  #e07820;
  --orange-bg: #1e1008;
  --green:   #4caf6a;
  --green-bg:#091a0f;
  --blue:    #4a90d9;
  --blue-bg: #081624;
  --red:     #d94a4a;
  --red-bg:  #1a0808;
  --purple:  #9a72d9;
  --purple-bg:#14092a;
  --pink:    #d9609a;
  --pink-bg: #1a0812;

  --font-head: 'Barlow Condensed', sans-serif;
  --font-body: 'Barlow', sans-serif;
  --font-mono: 'Share Tech Mono', monospace;
}

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ---- SCANLINE OVERLAY ---- */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.08) 2px,
    rgba(0,0,0,0.08) 4px
  );
  pointer-events: none;
  z-index: 1000;
}

/* ---- TOPBAR ---- */
.topbar {
  display: flex;
  align-items: stretch;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  position: sticky;
  top: 0;
  z-index: 500;
}

.topbar-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 24px;
  border-right: 1px solid var(--border);
  background: var(--gold-bg);
}

.logo-icon {
  width: 32px;
  height: 32px;
  position: relative;
  flex-shrink: 0;
}

.logo-icon svg {
  width: 100%;
  height: 100%;
}

.topbar-team {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.team-tag {
  font-family: var(--font-head);
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 0.08em;
  color: var(--gold);
  text-transform: uppercase;
  line-height: 1;
}

.team-sub {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text3);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.topbar-nav {
  display: flex;
  align-items: stretch;
  gap: 0;
  flex: 1;
}

.topbar-tab {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 24px;
  font-family: var(--font-head);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text2);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  border-right: 1px solid var(--border);
  transition: all 0.15s;
  user-select: none;
}

.topbar-tab:hover { color: var(--text); background: var(--bg3); }
.topbar-tab.active { color: var(--gold); border-bottom-color: var(--gold); background: var(--gold-bg); }

.tab-icon { font-size: 14px; }

.topbar-status {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 20px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 0.05em;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ---- PAGE WRAPPER ---- */
.page { display: none; }
.page.active { display: block; }

/* ---- MAP NAV (stratbook) ---- */
.map-nav-wrapper {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: stretch;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.map-nav-wrapper::-webkit-scrollbar { display: none; }

.map-btn {
  font-family: var(--font-head);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text2);
  padding: 10px 18px;
  border: none;
  background: none;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  transition: all 0.15s;
}
.map-btn:hover { color: var(--text); }
.map-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

/* ---- STRATBOOK CONTENT ---- */
.strat-content {
  padding: 24px;
  max-width: 1600px;
  margin: 0 auto;
}

/* ---- PLAYER LEGEND ---- */
.legend {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  padding: 10px 16px;
  background: var(--bg2);
  border: 1px solid var(--border);
  margin-bottom: 20px;
}

.legend-label {
  font-family: var(--font-head);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text3);
  margin-right: 8px;
}

.player-tag {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  white-space: nowrap;
  letter-spacing: 0.05em;
  clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
}

.tag-s15t3m  { background: #1a2e4a; color: #60a5fa; }
.tag-ole     { background: #14341e; color: #4ade80; }
.tag-propit3 { background: #3b1c0a; color: #fb923c; }
.tag-birk    { background: #3b0f0f; color: #f87171; }
.tag-mekkis  { background: #2d1b5e; color: #c4b5fd; }

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text3);
}

/* ---- MAP SECTION ---- */
.map-section { display: none; }
.map-section.active { display: block; }

.map-header {
  display: flex;
  align-items: flex-end;
  gap: 16px;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.map-title {
  font-family: var(--font-head);
  font-size: 32px;
  font-weight: 900;
  color: var(--gold);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  line-height: 1;
}

.map-meta {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text3);
  padding-bottom: 4px;
}

.map-id {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text3);
  padding-bottom: 5px;
}

/* ---- STRAT GRID ---- */
.strat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 12px;
}

/* ---- STRAT CARD ---- */
.strat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  padding: 0;
  display: flex;
  flex-direction: column;
  transition: border-color 0.15s;
  position: relative;
  overflow: hidden;
}

.strat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--card-accent, var(--gold));
  opacity: 0.6;
}

.strat-card:hover { border-color: var(--border2); }
.strat-card:hover::before { opacity: 1; }

.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px 10px;
}

.strat-name {
  font-family: var(--font-head);
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text);
  line-height: 1.2;
}

.strat-ref {
  font-size: 10px;
  color: var(--text3);
  margin-top: 2px;
  font-family: var(--font-mono);
}

.badge {
  font-family: var(--font-head);
  font-size: 10px;
  font-weight: 800;
  padding: 3px 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  white-space: nowrap;
  flex-shrink: 0;
  clip-path: polygon(5px 0%, 100% 0%, calc(100% - 5px) 100%, 0% 100%);
}

.badge-execute { background: var(--blue-bg); color: var(--blue); }
.badge-split   { background: var(--green-bg); color: var(--green); }
.badge-default { background: var(--purple-bg); color: var(--purple); }
.badge-rush    { background: var(--red-bg); color: var(--red); }
.badge-pistol  { background: var(--orange-bg); color: var(--orange); }
.badge-fake    { background: var(--pink-bg); color: var(--pink); }

.card-desc {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.6;
  padding: 0 16px 12px;
}

.card-divider {
  border: none;
  border-top: 1px solid var(--border);
}

/* ---- STEPS ---- */
.card-steps {
  padding: 12px 16px;
}

.section-label {
  font-family: var(--font-head);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 8px;
}

.steps {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.steps li {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.step-num {
  width: 18px;
  height: 18px;
  background: var(--bg4);
  border: 1px solid var(--border2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--gold);
  flex-shrink: 0;
  margin-top: 2px;
}

.step-body { flex: 1; min-width: 0; }

.step-players {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin-bottom: 3px;
}

.step-text {
  font-size: 12px;
  color: var(--text);
  line-height: 1.4;
}

/* ---- UTILITY ---- */
.card-util {
  padding: 10px 16px 14px;
}

.util-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.util-item {
  background: var(--bg3);
  border: 1px solid var(--border);
  padding: 4px 9px;
}

.util-name {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text);
}

.util-detail {
  font-size: 10px;
  color: var(--text3);
  margin-top: 1px;
}

/* ============================
   SCHEDULE PAGE
   ============================ */
.schedule-wrapper {
  padding: 24px;
  max-width: 1200px;
  margin: 0 auto;
}

.schedule-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  gap: 12px;
}

.schedule-title {
  font-family: var(--font-head);
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--gold);
  line-height: 1;
}

.schedule-subtitle {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text3);
  margin-top: 4px;
}

/* ---- ADD MATCH FORM ---- */
.add-match-btn {
  font-family: var(--font-head);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  background: var(--gold-bg);
  border: 1px solid var(--gold);
  color: var(--gold);
  padding: 8px 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}
.add-match-btn:hover { background: var(--gold); color: var(--bg); }

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 900;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--bg2);
  border: 1px solid var(--border2);
  padding: 0;
  width: 480px;
  max-width: 96vw;
  position: relative;
}

.modal-head {
  background: var(--gold-bg);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-title {
  font-family: var(--font-head);
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--gold);
}

.modal-close {
  background: none;
  border: none;
  color: var(--text2);
  font-size: 20px;
  cursor: pointer;
  line-height: 1;
  padding: 2px 6px;
}
.modal-close:hover { color: var(--text); }

.modal-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.form-label {
  font-family: var(--font-head);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text3);
}

.form-input, .form-select, .form-textarea {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 10px;
  font-family: var(--font-mono);
  font-size: 12px;
  outline: none;
  transition: border-color 0.15s;
  width: 100%;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus { border-color: var(--gold); }

.form-select option { background: var(--bg3); }
.form-textarea { resize: vertical; min-height: 70px; }

.form-submit {
  font-family: var(--font-head);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  background: var(--gold);
  border: none;
  color: var(--bg);
  padding: 10px 24px;
  cursor: pointer;
  width: 100%;
  margin-top: 4px;
  transition: all 0.15s;
}
.form-submit:hover { background: var(--gold2); }

/* ---- MATCH GROUPS ---- */
.match-group {
  margin-bottom: 28px;
}

.group-label {
  font-family: var(--font-head);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.group-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ---- MATCH CARD ---- */
.match-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  display: grid;
  grid-template-columns: 80px 1fr auto;
  align-items: center;
  gap: 0;
  margin-bottom: 8px;
  transition: border-color 0.15s;
  position: relative;
  overflow: hidden;
}

.match-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--match-color, var(--gold));
}

.match-card:hover { border-color: var(--border2); }

.match-datetime {
  padding: 14px 0 14px 18px;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.match-day {
  font-family: var(--font-head);
  font-size: 22px;
  font-weight: 900;
  color: var(--gold);
  line-height: 1;
}

.match-month {
  font-family: var(--font-head);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text3);
}

.match-time-label {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text2);
  margin-top: 4px;
}

.match-info {
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.match-title {
  font-family: var(--font-head);
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text);
}

.match-meta-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.match-maps {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.map-chip {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.08em;
  padding: 2px 7px;
  background: var(--bg4);
  border: 1px solid var(--border);
  color: var(--text2);
  text-transform: uppercase;
}

.match-note {
  font-size: 11px;
  color: var(--text3);
  font-style: italic;
}

.match-type-badge {
  font-family: var(--font-head);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 2px 8px;
  clip-path: polygon(5px 0%, 100% 0%, calc(100% - 5px) 100%, 0% 100%);
}

.type-scrim { background: #0f1e33; color: #4a90d9; }
.type-ranked { background: #1a0f00; color: #e07820; }
.type-practice { background: #091a0f; color: #4caf6a; }
.type-tournament { background: #1a0008; color: #d94a9a; }

.match-actions {
  padding: 0 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-end;
}

.match-delete {
  background: none;
  border: 1px solid var(--border);
  color: var(--text3);
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 4px 8px;
  cursor: pointer;
  transition: all 0.15s;
}
.match-delete:hover { border-color: var(--red); color: var(--red); }

.match-result {
  font-family: var(--font-head);
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.05em;
}
.result-w { color: var(--green); }
.result-l { color: var(--red); }
.result-d { color: var(--text2); }
.result-pending { color: var(--text3); font-size: 10px; letter-spacing: 0.08em; }

.empty-state {
  padding: 48px 24px;
  text-align: center;
  border: 1px solid var(--border);
  background: var(--bg2);
}

.empty-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.4; }
.empty-text {
  font-family: var(--font-head);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text3);
}
.empty-sub {
  font-size: 12px;
  color: var(--text3);
  margin-top: 6px;
  font-family: var(--font-mono);
}

/* ---- RESULT INPUT IN MODAL ---- */
.result-group {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.result-btn {
  font-family: var(--font-head);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 8px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
}
.result-btn.sel-W { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.result-btn.sel-L { background: var(--red-bg); border-color: var(--red); color: var(--red); }
.result-btn.sel-D { background: var(--bg4); border-color: var(--border2); color: var(--text); }
.result-btn.sel-TBD { background: var(--gold-bg); border-color: var(--gold); color: var(--gold); }

/* ---- STATS BAR ---- */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}

.stat-cell {
  background: var(--bg2);
  border: 1px solid var(--border);
  padding: 12px 16px;
  position: relative;
  overflow: hidden;
}

.stat-cell::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: var(--cell-accent, var(--gold));
  opacity: 0.5;
}

.stat-val {
  font-family: var(--font-head);
  font-size: 28px;
  font-weight: 900;
  color: var(--cell-color, var(--gold));
  line-height: 1;
}

.stat-label {
  font-family: var(--font-head);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text3);
  margin-top: 4px;
}

/* ---- RESPONSIVE ---- */
@media (max-width: 700px) {
  .strat-grid { grid-template-columns: 1fr; }
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
